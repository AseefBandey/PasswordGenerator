<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-pressed="false" aria-label="Switch to dark theme">
    <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <main class="page">
    <div class="card">
      <div class="eyebrow"><span class="prompt-dot"></span>PASSWORD GENERATOR</div>

      <div class="tabs" role="tablist" aria-label="Generation mode">
        <button type="button" class="tab active" id="tab-password" role="tab" aria-selected="true" aria-controls="passwordOptions" data-mode="password">Password</button>
        <button type="button" class="tab" id="tab-passphrase" role="tab" aria-selected="false" aria-controls="passphraseControls" data-mode="passphrase">Passphrase</button>
      </div>

      <div class="readout">
        <span class="readout-prefix" aria-hidden="true">$</span>
        <input type="text" id="passwordOutput" class="readout-input" readonly aria-live="polite" aria-label="Generated password" placeholder="click generate">
        <button id="copyBtn" class="icon-btn" type="button" aria-label="Copy to clipboard" title="Copy">
          <svg class="copy-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <svg class="check-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
      </div>

      <button id="generateBtn" class="generate-btn" type="button">Generate<span class="kbd">↵</span></button>

      <div class="strength" aria-live="polite">
        <div class="strength-row">
          <div class="strength-bar"><div id="strengthFill" class="strength-fill"></div></div>
          <span id="strengthText" class="strength-text">—</span>
        </div>
        <button id="toggleDetailsBtn" class="link-btn" type="button" aria-expanded="false" aria-controls="strengthDetails">show details</button>
        <dl id="strengthDetails" class="strength-details" hidden>
          <div><dt>Entropy</dt><dd id="entropyScore">—</dd></div>
          <div><dt>Length score</dt><dd id="lengthScore">—</dd></div>
          <div><dt>Variety</dt><dd id="varietyScore">—</dd></div>
          <div><dt>Character types</dt><dd id="charTypes">—</dd></div>
        </dl>
      </div>

      <section id="passwordOptions" class="options">
        <div class="row">
          <label for="lengthSlider">Length</label>
          <span id="lengthValue" class="row-value">16</span>
        </div>
        <input type="range" id="lengthSlider" min="4" max="64" value="16">

        <div class="checks">
          <label class="check"><input type="checkbox" id="uppercase" checked><span>A–Z</span></label>
          <label class="check"><input type="checkbox" id="lowercase" checked><span>a–z</span></label>
          <label class="check"><input type="checkbox" id="numbers" checked><span>0–9</span></label>
          <label class="check"><input type="checkbox" id="symbols" checked><span>!@#$</span></label>
          <label class="check"><input type="checkbox" id="excludeAmbiguous"><span>skip I/l/1/O/0</span></label>
        </div>

        <details class="custom-details">
          <summary>Custom character set</summary>
          <input type="text" id="customCharset" class="custom-input" placeholder="e.g. abc123!@#">
          <p class="hint">Overrides the checkboxes above when non-empty.</p>
        </details>
      </section>

      <section id="passphraseControls" class="options" hidden>
        <div class="row">
          <label for="wordCountSlider">Words</label>
          <span id="wordCountValue" class="row-value">4</span>
        </div>
        <input type="range" id="wordCountSlider" min="3" max="10" value="4">
        <label class="check"><input type="checkbox" id="includeNumbers" checked><span>append a number</span></label>
      </section>

      <div class="export-row">
        <button id="exportJsonBtn" class="ghost-btn" type="button">Export JSON</button>
        <button id="exportCsvBtn" class="ghost-btn" type="button">Export CSV</button>
      </div>

      <section class="history">
        <div class="history-head">
          <span>Session history</span>
          <button id="clearHistoryBtn" class="link-btn" type="button">clear</button>
        </div>
        <p class="hint">Kept in memory only — nothing here survives a page reload, on purpose.</p>
        <ul id="historyList" class="history-list"></ul>
      </section>
    </div>

    <footer class="footer">
      <p>Built by Aseef ·
        <a href="https://www.linkedin.com/in/aseefbandey/" target="_blank" rel="noopener noreferrer">LinkedIn</a> ·
        <a href="https://aseef-resume-nu.vercel.app/" target="_blank" rel="noopener noreferrer">Portfolio</a>
      </p>
    </footer>
  </main>

  <script src="core.js"></script>
  <script src="script.js"></script>
</body>
</html>
